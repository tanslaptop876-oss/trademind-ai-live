name: TradeMind isolated preview deployment
on:
  workflow_dispatch:
    inputs:
      preview_project:
        description: 'Exact dedicated Cloudflare Pages preview project name (must NOT be production)'
        type: string
        required: true
      confirm_preview_only:
        description: 'Confirm that this is an isolated, non-production Pages project'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: trademind-signal-isolated-preview
  cancel-in-progress: false
jobs:
  preview:
    if: ${{ inputs.confirm_preview_only == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: trademind-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate isolated project and configured preview secrets
        env:
          PREVIEW_PROJECT: ${{ inputs.preview_project }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.TRADEMIND_PREVIEW_CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TRADEMIND_PREVIEW_CF_ACCOUNT_ID }}
        run: |
          if ! [[ "$PREVIEW_PROJECT" =~ ^[a-z0-9-]{6,63}$ ]]; then echo 'Invalid preview project name'; exit 1; fi
          case "$PREVIEW_PROJECT" in
            trademind-ai-live|trademind-ai|trademind-live|marketingmind-ai-live)
              echo 'Refusing potentially production project name'; exit 1;;
          esac
          if [[ "$PREVIEW_PROJECT" != *-preview-* && "$PREVIEW_PROJECT" != *-staging-* ]]; then
            echo 'Require an isolated -preview- or -staging- project'; exit 1
          fi
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo 'Dedicated Cloudflare preview secrets not configured'; exit 1
          fi
          echo 'Preview-only project name and credentials present'
      - name: Run signal-only scanner tests
        run: |
          node tests/screener-engine.cjs
          node tests/market-data-free.cjs
          python3 tests/deployment-readiness.py
      - name: Package allowlisted static assets and read-only public market APIs
        run: node tests/build-signal-preview.cjs
      - name: Publish isolated non-production Pages project
        working-directory: .preview-package
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.TRADEMIND_PREVIEW_CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TRADEMIND_PREVIEW_CF_ACCOUNT_ID }}
          PREVIEW_PROJECT: ${{ inputs.preview_project }}
        run: |
          npx --yes wrangler@4 pages deploy public --project-name="$PREVIEW_PROJECT" --branch="signal-preview"
