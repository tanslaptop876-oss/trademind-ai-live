name: TradeMind scanner and market-data tests
on:
  push:
    branches:
      - feature/scanner-phase1-mtf-breakout
  pull_request:
    paths:
      - 'functions/api/**'
      - 'tests/**'
      - '*screener*.js'
      - 'scanner-extensions.js'
      - '.github/workflows/scanner-tests.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Historical and extended scanners
        run: node tests/screener-engine.cjs
      - name: Backtester
        run: node tests/backtest-engine.cjs
      - name: ICICI Breeze mocked adapter
        run: node tests/market-data-breeze.cjs
      - name: Public CoinDCX and FX mocked adapters
        run: node tests/market-data-free.cjs
      - name: Syntax check research UI
        run: node --check historical-screener.js
