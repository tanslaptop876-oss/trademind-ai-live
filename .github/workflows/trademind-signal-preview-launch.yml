name: TradeMind signal-only isolated preview launch
on:
  workflow_dispatch:
    inputs:
      confirm_preview_only:
        description: 'I confirm this is a dedicated, non-production Cloudflare Pages project'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: trademind-isolated-signal-preview
  cancel-in-progress: false

jobs:
  preview:
    if: ${{ inputs.confirm_preview_only == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: trademind-preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.TRADEMIND_PREVIEW_CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TRADEMIND_PREVIEW_CF_ACCOUNT_ID }}
      PREVIEW_PROJECT: ${{ vars.TRADEMIND_PREVIEW_PROJECT }}
      EXPECTED_PREVIEW_PROJECT_ID: ${{ vars.TRADEMIND_PREVIEW_PROJECT_ID }}
    steps:
      - name: Check out reviewed, tested feature revision
        uses: actions/checkout@v4
        with:
          ref: 45654d89c3b11f491b07de03a015b90b2a4838ea
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate dedicated Cloudflare preview project identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" || -z "${EXPECTED_PREVIEW_PROJECT_ID:-}" ]]; then
            echo 'Missing preview-only Cloudflare credentials or expected project ID'
            exit 1
          fi
          if ! [[ "${PREVIEW_PROJECT:-}" =~ ^[a-z0-9-]{6,63}$ ]]; then
            echo 'Invalid preview project name'
            exit 1
          fi
          if [[ "$PREVIEW_PROJECT" != *-preview-* && "$PREVIEW_PROJECT" != *-staging-* ]]; then
            echo 'Requires a dedicated -preview- or -staging- project name'
            exit 1
          fi
          case "$PREVIEW_PROJECT" in
            trademind-ai-live|trademind-ai|trademind-live|marketingmind-ai-live)
              echo 'Refusing production-like project name'; exit 1 ;;
          esac
          PROJECT_JSON="$(curl --fail --silent --show-error --max-time 20 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PREVIEW_PROJECT")"
          printf '%s' "$PROJECT_JSON" | jq -e \
            --arg name "$PREVIEW_PROJECT" --arg id "$EXPECTED_PREVIEW_PROJECT_ID" \
            '.success == true and .result.name == $name and .result.id == $id' >/dev/null
          echo 'Dedicated preview Pages project identity verified'

      - name: Run signal-only tests and validate packaging
        shell: bash
        run: |
          set -euo pipefail
          node tests/screener-engine.cjs
          node tests/market-data-free.cjs
          python3 tests/deployment-readiness.py
          node tests/build-signal-preview.cjs

      - name: Compile preview-only Pages Functions
        working-directory: .preview-package
        run: npx --yes wrangler@4 pages functions build functions --outdir=.wrangler-preview-build

      - name: Deploy to verified isolated preview project
        working-directory: .preview-package
        run: npx --yes wrangler@4 pages deploy public --project-name="$PREVIEW_PROJECT" --branch=signal-preview
